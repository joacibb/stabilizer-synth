[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stabilizer-synth"
version = "0.1.0"
authors = [
  { name = "Joaquin", email = "joaquin@users.noreply.github.com" },
]
description = "Fast SAT-based synthesis of non-CSS quantum stabilizer codes with group symmetries and 2D layout optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["quantum", "qec", "quantum-error-correction", "qldpc", "sat-solver", "stabilizer-codes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "python-sat>=1.8.dev0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]
simulation = [
  "stim>=1.12.0",
]

[project.urls]
"Homepage" = "https://github.com/joacibb/stabilizer-synth"
"Bug Tracker" = "https://github.com/joacibb/stabilizer-synth/issues"

[tool.setuptools.packages.find]
where = ["src"]
